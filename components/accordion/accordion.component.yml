name: Accordion
description: 'List of items that can be clicked to hide or reveal additional content.'
props:
  type: object
  properties:
    color_mode:
      type: ['string', 'null']
      title: 'Color mode'
      description: 'Name of the color mode.'
    sidebar:
      type: [ 'boolean', 'null' ]
      title: 'Sidebar layout'
      description: 'Use the sidebar layout. Optional.'
    extra_classes:
      type: ['string', 'null']
      title: 'Extra classes string'
      description: 'Extra classes string'
    extra_attributes:
      type: ['array', 'null']
      title: 'Extra attributes'
      description: 'List of extra attributes.'
    items:
      type: ['array', 'null']
      title: 'Accordion items'
      description: 'List of accordion items'

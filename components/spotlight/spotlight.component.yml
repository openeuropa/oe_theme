name: Spotlight
description: 'The Spotlight consists of a header, title, an image and an optional link.'
props:
  type: object
  properties:
    header:
      type: ['string', 'null']
      title: Header
      description: 'Header of the spotlight.'
    title:
      type: ['string', 'null']
      title: Title
      description: 'Title of the spotlight.'
    font_size:
      type: ['string', 'null']
      title: 'Font size'
      description: "Size of the title (can be 'm', 'l') Defaults to 'l'."
    path:
      type: ['string', 'null']
      title: Path
      description: 'Spotlight link url.'
    picture:
      type: ['object', 'null']
      title: Picture
      description: 'Image for the spotlight, following ECL Picture structure.'
    full_width:
      type: ['boolean', 'null']
      title: 'Full width'
      description: 'Full width spotlight (extend outside the grid).'
    credit:
      type: ['string', 'null']
      title: Credit
      description: 'Credit for the picture.'
    color_mode:
      type: ['string', 'null']
      title: 'Color mode'
      description: 'Name of the color mode.'
    has_anchor:
      type: ['boolean', 'null']
      title: Anchor
      description: "Whether the spotlight has an anchor or not. Default to 'true'."
    extra_classes:
      type: ['string', 'null']
      title: 'Extra classes'
      description: 'Extra classes string.'
    extra_attributes:
      type: ['array', 'null']
      title: 'Extra attributes'
      description: 'List of extra attributes.'

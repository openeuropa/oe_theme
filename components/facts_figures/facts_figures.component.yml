name: 'Facts and figures'
description: 'The facts and figures component is used to deliver numerical representations of facts that are easier to portray visually through the use of statistics.'
props:
  type: object
  properties:
    items:
      type: ['array', 'null']
      title: Facts
      description: 'List of facts'
    font_size:
      type: ['string', 'null']
      title: 'Font size'
      description: "The size can be 'm' or 'l'. Defaults to 'l'."
    view_all:
      type: ['object', 'null']
      title: 'View all'
      description: 'View all link'
    external_link:
      type: ['boolean', 'null']
      title: 'External link'
      description: 'Whether the view all URL is external or not.'
    centered:
      type: ['boolean', 'null']
      title: Centered
      description: "Whether the items' content should be centered."
    color_mode:
      type: ['string', 'null']
      title: 'Color mode'
      description: 'Name of the color mode.'
    extra_classes:
      type: ['string', 'null']
      title: 'Extra classes string'
      description: 'Extra classes string'

name: 'Navigation list'
description: 'Navigation lists allow to structure groups of links together.'
variants:
  default:
    title: Default
    description: 'Default implementation of the ECL Navigation list item component.'
  illustration:
    title: Illustration
    description: 'Displays the image in the top right corner.'
  image_as_illustration:
    title: 'Image as illustration'
    description: 'Displays the image in the top right corner without a background.'
props:
  type: object
  properties:
    title:
      type: ['string', 'null']
      title: Title
      description: 'Title of the navigation list.'
    title_url:
      type: ['string', 'null']
      title: 'Title URL'
      description: 'URL to link the title of the navigation list.'
    external_link:
      type: ['boolean', 'null']
      title: 'External link'
      description: 'Whether the title URL is external or not.'
    title_extra_attributes:
      type: ['array', 'null']
      title: 'Link attributes'
      description: 'Extra attributes for title link'
    description:
      type: ['string', 'null']
      title: Description
      description: 'Short description that accompanies the navigation list'
    links:
      type: ['array', 'null']
      title: Links
      description: 'Array of links that form the navigation list.'
    secondary_links:
      type: ['array', 'null']
      title: 'Secondary Links'
      description: 'Secondary array of links that form the navigation list.'
    border:
      type: ['boolean', 'null']
      title: Border
      description: 'Whether the border should be used.'
    image:
      type: ['object', 'null']
      title: Image
      description: "Item image - a smaller image or an actual icon should be provided when using the 'illustration' variant."
    color_mode:
      type: ['string', 'null']
      title: 'Color mode'
      description: 'Name of the color mode (only working with the illustration variant).'
    extra_classes:
      type: ['string', 'null']
      title: 'Extra classes string'
      description: 'Extra classes string'

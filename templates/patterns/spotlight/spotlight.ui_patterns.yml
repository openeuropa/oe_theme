spotlight:
  label: "Spotlight"
  description: "The Spotlight consists of a header, title, an image and an optional link."
  fields:
    header:
      type: "text"
      label: "Header"
      description: "Header of the spotlight."
      preview: "In focus"
    title:
      type: "text"
      label: "Title"
      description: "Title of the spotlight."
      preview: "Proin molestie sapien ut blandit"
    font_size:
      type: "text"
      label: "Font size"
      description: "Size of the title (can be 'm', 'l') Defaults to 'l'."
      preview: "m"
    path:
      type: "Url"
      label: "Path"
      description: "Spotlight link url."
      preview: "http://example.com"
    picture:
      type: "array"
      label: "Picture"
      description: "Image for the spotlight, following ECL Picture structure."
      preview:
        img:
          src: "https://inno-ecl.s3.amazonaws.com/media/examples/example-image.jpg"
          alt: "alternative text"
    full_width:
      type: "boolean"
      label: "Full width"
      description: "Full width spotlight (extend outside the grid)."
      preview: true
      escape: false
    credit:
      type: "text"
      label: "Credit"
      description: "Credit for the picture."
      preview: "© Copyright or credit"
    color_mode:
      type: "text"
      label: "Color mode"
      description: "Name of the color mode."
      preview: "red-tomato"
    has_anchor:
      type: "boolean"
      label: "Anchor"
      description: "Whether the spotlight has an anchor or not. Default to 'true'."
      preview: true
      escape: false
    extra_classes:
      type: 'text'
      label: 'Extra classes'
      description: 'Extra classes string.'
      preview: ''
    extra_attributes:
      type: "array"
      label: "Extra attributes"
      description: "List of extra attributes."
      preview:
        - name: "extra-attr"
          value: "extra value"

animated_numbers:
  label: "Animated numbers"
  description: "The Animated numbers component is used to deliver numerical representations that are easier to portray visually through the use of statistics."
  fields:
    with_background:
      type: "boolean"
      label: "With background"
      description: "Whether the component should have a dark background color or not (default false)."
      preview: true
      escape: false
    counter_color:
      type: "boolean"
      label: "Counter color"
      description: "Whether the counters should colored or not (default true)."
      preview: false
      escape: false
    border:

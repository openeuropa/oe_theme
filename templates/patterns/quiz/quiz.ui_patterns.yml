quiz:
  label: "Quiz"
  description: "Quiz pattern variants."
  variants:
    default:
      label: "Quiz: poll"
      description: "Poll quiz contains multiple card items with a question and multiple answers of which one is correct."
    reveal:
      label: "Quiz: reveal"
      description: "Reveal quiz contains multiple card items with a question and its answer to be revealed."
  fields:
    title:
      type: "text"
      label: "Title"
      description: "Quiz title"
      preview: "Ut enim ad minim veniam"
    description:
      type: "text"
      label: "Description"
      description: "Description text accompanying quiz."
      preview: "Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.\n    Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. \n    Excepteur sint occaecat cupidatat non proident, sunt."
    next_label:
      type: "text"
      label: "Next label"
      description: "The label of the button showing the card items to the right."
      preview: "Next"
    prev_label:
      type: "text"
      label: "Previous label"
      description: "The label of the button showing the card items to the left."
      preview: "Previous"
    with_background:
      type: "boolean"
      label: "With background"
      description: "Whether the Quiz should have a background color or not (default: false)."
      preview: false
      escape: false
    items:
      type: array
      label: "Card items"
      description: "The card items of the quiz. Depending on the variant, only a part of the parameters will be used from this array."
      preview:
        - question: "Which institution proposes new EU laws?"
          options:
            - name: "European commission"
              correct: true
            - name: "European parliament"
            - name: "European Central Bank"
            - name: "Court of Justice of the European Union"
          answer_title: "The correct answer is A."
          answer: "The European Commission has the exclusive right to propose new EU laws"
          icon_name: "clock"
          icon_family: "ecl"
        - question: "What document allows EU citizens to travel freely between most EU countries?"
          options:
            - name: "A valid ID card."
            - name: "A valid ID card or passport"
              correct: true
            - name: "A valid passport."
            - name: "None of these"
          answer_title: "The correct answer is B."
          answer: "A valid ID card or passport is usually enough to travel freely between most EU countries."
        - question: "What currency is used in many EU countries?"
          options:
            - name: "The pound is the most used currency in the EU"
            - name: "The Leu is by far the most used currency in the European Union"
            - name: "The euro (€) is used in many EU member states."
              correct: true
          answer_title: "The correct answer is C."
          answer: "The Euro is the official currency used by many EU conutries"
          icon_name: "threads"
          icon_family: "networks"
        - question: "Lorem ipsum dolor sit amet, consectetur adipiscing elit?"
          options:
            - name: "Duis id mattis libero. Quisque accumsan nisi in nisl ultrices dictum"
            - name: "Lorem ipsum dolor sit amet, consectetur adipiscing elit."
              correct: true
            - name: "ivamus auctor blandit auctor."
          answer_title: "The correct answer is B."
          answer: "Duis id mattis libero. Quisque accumsan nisi"
          icon_name: "airplane"
          icon_family: "phosphor"
        - question: "Nam lorem eros, auctor at feugiat id, efficitur non velit. Nam ac arcu vitae eros dapibus cursus vel eget lectus."
          options:
            - name: "Aenean est metus, malesuada sed suscipit id, tempor non sapien."
            - name: "In id nisi vel diam mollis varius. In vitae dui et dolor suscipit venenatis."
            - name: "Aenean facilisis venenatis lacus, et egestas quam mattis eu."
              correct: true

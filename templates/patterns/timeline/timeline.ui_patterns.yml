timeline:
  label: "Timeline"
  description: "A timeline is a way of displaying a list of events in chronological order."
  fields:
    title:
      type: "text"
      label: "Title"
      description: "Timeline title."
      preview: "Timeline heading"
    introduction:
      type: "text"
      label: "Introduction"
      description: "Optional Timeline introduction text."
      preview: "Timeline introduction"
    limit:
      type: "numeric"
      label: "Timeline index for starting hiding"
      description: "Item index after which to start hiding timeline items. Default is null."
      preview: 2
      escape: false
    limit_to:
      type: "numeric"
      label: "Timeline index for starting displaying"
      description: "Item index after which to resume displaying timeline items. Default is null."
      escape: false
      preview: 3
    button_label:
      type: "text"
      label: "Button label"
      description: "Show timeline button label."
    button_label_hidden:
      type: "text"
      label: "Button label hidden"
      description: "Hidden timeline button label."
    color_mode:
      type: "text"
      label: "Color mode"
      description: "Name of the color mode."
      preview: "green-dark"
    extra_classes:
      type: 'text'
      label: 'Extra classes string'
      description: 'Extra classes string'
      preview: ''
    headline:
      type: "array"
      label: "Timeline headline"
      description: "The timeline headline will be displayed as the first item of the timeline and it has the same structure as a regular timeline item."

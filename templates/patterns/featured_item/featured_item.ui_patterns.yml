featured_item:
  label: "Featured item"
  description: "The featured item component uses a different visualisation to attract user attention."
  variants:
    default:
      label: "Default"
      description: "A featured item with a title, an image, a description and some meta information."
    extended:
      label: "Extended"
      description: "Like the default variant but with an extra button on it."
  fields:
    image:
      type: "array"
      label: "Image"
      description: "Image of the featured item."
      preview:
        src: "https://loremflickr.com/1000/500/arch"
        alt: "Alternative text for featured item image"
    picture_zoom:
      type: "boolean"
      label: "Picture zoom"
      description: "Whether the picture should be animated or not (default: false)."
      preview: true
      escape: false
    description:
      type: "text"
      label: "Description"
      description: "Description of the featured item."
      preview: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Quid est igitur, inquit, quod requiras? Sed quod proximum fuit non vidit. Aperiendum est igitur, quid sit voluptas; Contemnit enim disserendi elegantiam, confuse loquitur."
    length:
      type: numeric
      label: "Max length"
      description: "Used to trim the length of the Description field (optional)."
      preview: 150
      escape: false
    metas:
      type: "array"
      label: "Metas"
      description: "A collection of page meta information."
      preview:
        - "News article"
        - "6 July 2015"
        - "Brussels"
    footer_items:
      type: "Array"
      label: "Footer items"
      description: "A list of 'icon with text' pairs to be displayed on the card footer."
      preview:
        - icon: "calendar"
          text: "15-16 November 2019, 08:00 AM"
        - icon: "location"
          text: "Brussels, Belgium"
        - icon: "livestreaming"
          text: "Live streaming available"
    title:
      type: "text"
      label: "Title"
      description: "The title of the page."
      preview: "Business, Economy, Euro"
    link:
      type: "array"
      label: "Link"
      description: "Link in the featured item."
      preview:
        href: "http://example.com"
        label: "Read more"
    badges:
      type: array
      label: "Badges"
      description: "Adds different badges to the item."
      preview:
        - label: "Highlighted"
          variant: "highlight"
        - label: "Status: Open"
          variant: "high"
    external_link:
      type: "boolean"
      label: "External link"
      description: "Whether item's link is external or not."
      preview: false
    contextual_links:
      type: "array"
      label: "Contextual links"
      description: "Render array of contextual links"
      preview: ~
    lists:
      type: "array"
      label: "Additional information"
      description: "Array of lists compatible with the ECL Description list component. For 'link', 'link-inline' and 'taxonomy' variants of the list, the list_type is mandatory. If an iterable definition has at least one path provided, all the other items need to provide a path as well."
      preview:
        -
          - term: "When"
            definition: "Thursday 15 November, 08:00 AM to Friday 16 November"
          - term: "Where"
            definition:
              - "The EGG, Rue Barra 175, 1070 Brussels, Belgium"
              - "Rue Belliard 28, 1000 Brussels, Belgium"
          - term: "Standalone links"
            list_type: "link"
            definition:
              - label: "First link"
                path: "https://example.com/1"
                icon: "copy"
              - path: "https://example.com/2"
                icon: "download"
              - label: "Third link"
                path: "https://example.com/3"
                external_link: TRUE
          - term: "Inline links"
            definition:
              - label: "First inline-link"
                path: "https://example.com/1"
                external_link: TRUE
              - label: "Second inline-link"
                path: "https://example.com/2"
              - path: "https://example.com/3"
            list_type: "link-inline"
          - term: "Taxonomy list"
            list_type: "taxonomy"
            definition:
              - label: "Taxonomy item 1"
              - "Taxonomy item 2"
              - "Taxonomy item 3"
    lists_variant:
      type: "string"
      label: "Lists variant"
      description: "An optional parameter for the layout of the lists (vertical or horizontal). It defaults to vertical."
      preview: "vertical"
    color_mode:
      type: "text"
      label: "Color mode"
      description: "Name of the color mode."
      preview: "orange"
    extra_attributes:
      type: "array"
      label: "Extra attributes"
      description: "List of extra attributes"
      preview:
        - name: "extra-attr"
          value: "extra value"
    extra_classes:
      type: 'text'
      label: 'Extra classes string'
      description: 'Extra classes string'
      preview: ''
